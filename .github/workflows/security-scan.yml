name: Dependency vulnerability scan

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: Scan dependencies for known vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      # Scoped to the active Flutter prototype; JS starters are not shipped this term.
      scan-args: |-
        --lockfile=./flutter/pubspec.lock
      fail-on-vuln: true
