name: React Native CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - id: validation
        name: Run tests with coverage
        run: npm run test:coverage -- --runInBand

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: react-native-coverage
          path: react-native/coverage/lcov.info
          if-no-files-found: error

      - name: Update pull request validation summary
        if: >-
          ${{
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: ./.github/actions/pr-validation-summary
        with:
          coverage-path: react-native/coverage/lcov.info
          outcome: ${{ steps.validation.outcome == 'success' && 'success' || 'failure' }}
          platform: React Native
