name: React Native CI

on:
  workflow_call:
    inputs:
      run:
        description: Whether React Native validation is relevant to this event.
        required: true
        type: boolean
    outputs:
      details:
        description: React Native test-count summary.
        value: ${{ jobs.validate-react-native.outputs.details }}
      outcome:
        description: React Native validation outcome.
        value: ${{ jobs.validate-react-native.outputs.outcome }}

permissions:
  contents: read

jobs:
  validate-react-native:
    if: inputs.run
    outputs:
      details: ${{ steps.validation.outputs.details }}
      outcome: ${{ steps.outcome.outputs.value || 'skipped' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - id: validation
        name: Run tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage -- --runInBand 2>&1 | tee test-output.txt
          test_output=$(sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' test-output.txt)
          suites=$(printf '%s\n' "$test_output" | sed -nE 's/^[[:space:]]*Test Suites:[[:space:]]*([0-9]+).*/\1/p' | tail -1)
          tests=$(printf '%s\n' "$test_output" | sed -nE 's/^[[:space:]]*Tests:[[:space:]]*([0-9]+).*/\1/p' | tail -1)
          echo "details=$suites suites / $tests tests" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: react-native-coverage
          path: react-native/coverage/lcov.info
          if-no-files-found: error

      - id: outcome
        if: always()
        name: Record validation outcome
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "value=$JOB_STATUS" >> "$GITHUB_OUTPUT"
