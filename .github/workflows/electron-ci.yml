name: Electron CI

on:
  workflow_call:
    inputs:
      run:
        description: Whether Electron validation is relevant to this event.
        required: true
        type: boolean
    outputs:
      details:
        description: Electron test-count summary.
        value: ${{ jobs.validate-electron.outputs.details }}
      outcome:
        description: Electron validation outcome.
        value: ${{ jobs.validate-electron.outputs.outcome }}

permissions:
  contents: read

jobs:
  validate-electron:
    if: inputs.run
    outputs:
      details: ${{ steps.validation.outputs.details }}
      outcome: ${{ steps.outcome.outputs.value || 'skipped' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - id: validation
        name: Run Electron tests and coverage
        run: |
          set -o pipefail
          npm test -- --coverage
          xvfb-run --auto-servernum npm run test:e2e
          coverage=$(node -e 'const c = require("./coverage/coverage-summary.json").total; console.log(`lines ${c.lines.pct}% · branches ${c.branches.pct}%`);')
          echo "details=Jest $coverage · Electron E2E passed" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-coverage-report
          path: electron/coverage
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-test-results
          path: electron/test-results
          if-no-files-found: ignore

      - id: outcome
        if: always()
        name: Record validation outcome
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "value=$JOB_STATUS" >> "$GITHUB_OUTPUT"
