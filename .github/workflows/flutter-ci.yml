name: Flutter CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter source
        run: flutter analyze

      - id: validation
        name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: error

      - name: Update pull request validation summary
        if: >-
          ${{
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: ./.github/actions/pr-validation-summary
        with:
          coverage-path: flutter/coverage/lcov.info
          outcome: ${{ steps.validation.outcome == 'success' && 'success' || 'failure' }}
          platform: Flutter
