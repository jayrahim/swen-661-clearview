name: Flutter CI

on:
  workflow_call:
    outputs:
      details:
        description: Flutter test-count summary.
        value: ${{ jobs.validate-flutter.outputs.details }}

permissions:
  contents: read

jobs:
  validate-flutter:
    outputs:
      details: ${{ steps.validation.outputs.details }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter source
        run: flutter analyze

      - id: validation
        name: Run tests with coverage
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test-output.txt
          test_count=$(sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' test-output.txt | sed -nE 's/.*[^0-9]([0-9][0-9]*) tests passed\..*/\1/p' | tail -1)
          echo "details=${test_count:+$test_count tests}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: error
