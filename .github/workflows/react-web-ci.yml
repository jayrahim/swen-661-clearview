name: React web CI

on:
  pull_request:
    paths:
      - 'react-web/**'
      - '.github/workflows/react-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'react-web/**'
      - '.github/workflows/react-web-ci.yml'

permissions:
  contents: read

jobs:
  validate-react-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Jest and React Testing Library coverage
        run: npm run test:coverage -- --runInBand

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npx playwright test

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-web-coverage
          path: react-web/coverage
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-web-playwright-report
          path: react-web/playwright-report
          if-no-files-found: warn

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: react-web-playwright-test-results
          path: react-web/test-results
          if-no-files-found: ignore
