name: React web CI

on:
  workflow_call:
    inputs:
      run:
        description: Whether React web validation is relevant to this event.
        required: true
        type: boolean
    outputs:
      details:
        description: React web test-count summary.
        value: ${{ jobs.validate-react-web.outputs.details }}
      outcome:
        description: React web validation outcome.
        value: ${{ jobs.validate-react-web.outputs.outcome }}

permissions:
  contents: read

jobs:
  validate-react-web:
    if: inputs.run
    outputs:
      details: ${{ steps.validation.outputs.details }}
      outcome: ${{ steps.outcome.outputs.value || 'skipped' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Jest and React Testing Library coverage
        run: |
          set -o pipefail
          npm run test:coverage -- --runInBand 2>&1 | tee test-output.txt

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee playwright-output.txt

      - id: validation
        name: Record validation details
        run: |
          jest_tests=$(sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' test-output.txt | sed -nE 's/^[[:space:]]*Tests:[[:space:]]*([0-9]+).*/\1/p' | tail -1)
          playwright_tests=$(sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' playwright-output.txt | sed -nE 's/^[[:space:]]*([0-9]+) passed.*/\1/p' | tail -1)
          echo "details=Jest ${jest_tests:-0} tests / Playwright ${playwright_tests:-0} tests" >> "$GITHUB_OUTPUT"

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-web-coverage
          path: react-web/coverage
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: react-web-playwright-report
          path: react-web/playwright-report
          if-no-files-found: warn

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: react-web-playwright-test-results
          path: react-web/test-results
          if-no-files-found: ignore

      - id: outcome
        if: always()
        name: Record validation outcome
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "value=$JOB_STATUS" >> "$GITHUB_OUTPUT"
