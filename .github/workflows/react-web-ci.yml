name: React web CI

on:
  pull_request:
    paths:
      - 'react-web/**'
      - '.github/workflows/react-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'react-web/**'
      - '.github/workflows/react-web-ci.yml'

permissions:
  contents: read

jobs:
  validate-react-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
