name: Update PR validation summary
description: Publishes one sticky platform-validation comment for an internal pull request.

inputs:
  flutter-details:
    description: Flutter test-count summary.
    required: false
  flutter-outcome:
    description: Flutter validation outcome.
    required: true
  react-native-details:
    description: React Native test-count summary.
    required: false
  react-native-outcome:
    description: React Native validation outcome.
    required: true
  security-outcome:
    description: Security scan outcome.
    required: true

runs:
  using: composite
  steps:
    - name: Update sticky pull request comment
      uses: actions/github-script@v9
      env:
        FLUTTER_DETAILS: ${{ inputs.flutter-details }}
        FLUTTER_OUTCOME: ${{ inputs.flutter-outcome }}
        REACT_NATIVE_DETAILS: ${{ inputs.react-native-details }}
        REACT_NATIVE_OUTCOME: ${{ inputs.react-native-outcome }}
        SECURITY_OUTCOME: ${{ inputs.security-outcome }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          function coverageSummary(relativePath, outcome) {
            const coveragePath = path.join(process.env.GITHUB_WORKSPACE, relativePath);
            if (
              outcome !== 'success' ||
              !fs.existsSync(coveragePath) ||
              !fs.statSync(coveragePath).isFile()
            ) {
              return '—';
            }

            const totals = { BRF: 0, BRH: 0, FNF: 0, FNH: 0, LF: 0, LH: 0 };
            for (const line of fs.readFileSync(coveragePath, 'utf8').split('\n')) {
              const match = line.match(/^(BRF|BRH|FNF|FNH|LF|LH):(\d+)$/);
              if (match) totals[match[1]] += Number(match[2]);
            }

            const percentage = (covered, found) =>
              found ? `${((covered / found) * 100).toFixed(2)}%` : '—';
            return [
              `lines ${percentage(totals.LH, totals.LF)}`,
              `branches ${percentage(totals.BRH, totals.BRF)}`,
              `functions ${percentage(totals.FNH, totals.FNF)}`,
            ].join(' · ');
          }

          const outcomeStatus = (outcome) =>
            outcome === 'success' ? '✅ Passed' : '❌ Failed';
          const details = (testDetails, coverage) =>
            [testDetails, coverage === '—' ? '' : coverage].filter(Boolean).join(' · ') || '—';
          const rows = [
            [
              'Flutter',
              process.env.FLUTTER_OUTCOME,
              details(
                process.env.FLUTTER_DETAILS,
                coverageSummary('coverage/flutter/lcov.info', process.env.FLUTTER_OUTCOME),
              ),
            ],
            [
              'React Native',
              process.env.REACT_NATIVE_OUTCOME,
              details(
                process.env.REACT_NATIVE_DETAILS,
                coverageSummary(
                  'coverage/react-native/lcov.info',
                  process.env.REACT_NATIVE_OUTCOME,
                ),
              ),
            ],
            ['Electron', '', 'Not yet included in validation'],
            ['Security', process.env.SECURITY_OUTCOME, 'OSV scan'],
          ];
          const marker = '<!-- clearview-validation-summary -->';
          const body = [
            marker,
            '## ClearView validation',
            '',
            '| Platform | Result | Details |',
            '| --- | --- | --- |',
            ...rows.map(([platform, outcome, result]) =>
              `| ${platform} | ${outcome ? outcomeStatus(outcome) : '—'} | ${result} |`,
            ),
          ].join('\n');
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(
            (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
