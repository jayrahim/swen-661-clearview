name: Update PR validation summary
description: Publishes a single sticky platform-validation comment for internal pull requests.

inputs:
  coverage-path:
    description: Path to the platform lcov.info file relative to the repository root.
    required: true
  outcome:
    description: Outcome of the platform validation steps.
    required: true
  platform:
    description: Platform name for the summary row.
    required: true

runs:
  using: composite
  steps:
    - name: Update sticky pull request comment
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const platform = core.getInput('platform');
          const outcome = core.getInput('outcome');
          const coveragePath = path.join(
            process.env.GITHUB_WORKSPACE,
            core.getInput('coverage-path'),
          );

          if (
            context.payload.pull_request.head.repo.full_name !==
            context.payload.repository.full_name
          ) {
            core.info('Skipping PR comments for a fork-based pull request.');
            return;
          }

          function coverageSummary() {
            if (outcome !== 'success' || !fs.existsSync(coveragePath)) {
              return '—';
            }

            const totals = { BRF: 0, BRH: 0, FNF: 0, FNH: 0, LF: 0, LH: 0 };
            for (const line of fs.readFileSync(coveragePath, 'utf8').split('\n')) {
              const match = line.match(/^(BRF|BRH|FNF|FNH|LF|LH):(\d+)$/);
              if (match) totals[match[1]] += Number(match[2]);
            }

            const percentage = (covered, found) =>
              found ? `${((covered / found) * 100).toFixed(2)}%` : '—';
            return [
              `lines ${percentage(totals.LH, totals.LF)}`,
              `branches ${percentage(totals.BRH, totals.BRF)}`,
              `functions ${percentage(totals.FNH, totals.FNF)}`,
            ].join(' · ');
          }

          const marker = '<!-- clearview-validation-summary -->';
          const dataMarker = '<!-- clearview-validation-data:';
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find(
            (comment) => comment.user.type === 'Bot' && comment.body.includes(marker),
          );
          const dataMatch = existing?.body.match(
            /<!-- clearview-validation-data:([\s\S]*?) -->/,
          );
          const summary = dataMatch ? JSON.parse(dataMatch[1]) : {};
          summary[platform] = {
            coverage: coverageSummary(),
            status: outcome === 'success' ? '✅ Passed' : '❌ Failed',
          };

          const row = (name) => {
            const result = summary[name];
            return result
              ? `| ${name} | ${result.status} | ${result.coverage} |`
              : `| ${name} | — | Not configured |`;
          };
          const body = [
            marker,
            `<!-- clearview-validation-data:${JSON.stringify(summary)} -->`,
            '## ClearView validation',
            '',
            '| Platform | Result | Coverage |',
            '| --- | --- | --- |',
            row('Flutter'),
            row('React Native'),
            '| Electron | — | Not configured |',
          ].join('\n');

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            return;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body,
          });
